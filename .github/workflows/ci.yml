name: CI

# Checks that everything builds. It publishes nothing: a release is made by hand with the Release workflow.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Seneschal.slnx -c Release

      - name: Pack the SDK
        run: dotnet pack src/Seneschal.Sdk -c Release -o sdk-package

      - name: Check the package
        shell: pwsh
        run: |
          # Without its build rules an extension cannot be staged or packed, which is the point of the package
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Get-ChildItem sdk-package -Filter *.nupkg).FullName)
          $names = $archive.Entries | ForEach-Object FullName
          $archive.Dispose()
          foreach ($required in 'build/Seneschal.Sdk.targets', 'lib/net10.0/Seneschal.Sdk.dll') {
            if ($names -notcontains $required) { throw "The package has no $required" }
          }
