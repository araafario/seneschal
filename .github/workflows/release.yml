name: Release

# Run by hand: Actions, Release, Run workflow. Nothing is released by a push.
# It builds Seneschal for Windows (x64 and arm64, with .NET included, so nothing has to be installed first), tags the commit it was
# started on as v<version> and puts the zips and their checksums on a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: What kind of release. Fix is 1.0.4 to 1.0.5, Normal is 1.0.4 to 1.1.0, Breaking is 1.0.4 to 2.0.0. It is counted from the latest release tag
        required: true
        type: choice
        options: [fix, normal, breaking]
        default: fix
      version:
        description: Only to set the number yourself, such as 1.2.0 (the choice above is then ignored). Leave empty to count from the latest release
        required: false
        type: string
      prerelease:
        description: A pre-release (the version gets -beta.<run number> and the release is marked as a pre-release)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags, which is where the last version is read from

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $version = "$env:INPUT_VERSION".Trim().TrimStart('v')
          if (-not $version) {
            # Counted from the latest release (a v1.2.3 tag, pre-releases do not count), so no file has to be changed and committed for a release
            $latest = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | ForEach-Object { [version]$_.Substring(1) } | Sort-Object -Descending | Select-Object -First 1
            # version.txt is the lowest a release can be: raise it (2.0) to start a new major or minor line
            $parts = (Get-Content version.txt).Trim().Split('.')
            $floor = [version]"$($parts[0]).$(if ($parts.Count -gt 1) { $parts[1] } else { 0 }).0"
            if (-not $latest) { $next = $floor }
            else {
              $next = switch ($env:BUMP) {
                'breaking' { [version]"$($latest.Major + 1).0.0" }
                'normal' { [version]"$($latest.Major).$($latest.Minor + 1).0" }
                default { [version]"$($latest.Major).$($latest.Minor).$($latest.Build + 1)" }
              }
              if ($floor -gt $next) { $next = $floor }
            }
            $version = "$next"
            if ($env:PRERELEASE -eq 'true') { $version += "-beta.${{ github.run_number }}" }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$version' is not a version such as 1.2.0" }
          if (git tag --list "v$version") { throw "v$version already exists. Pick another version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version"

      - name: Build
        run: dotnet build Seneschal.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            # The app and its launcher (what the shortcuts start) go into one folder
            foreach ($project in 'Seneschal.Host', 'Seneschal.Launcher') {
              dotnet publish "src/$project" -c Release -r $rid --self-contained "-p:AppVersion=$version" -o "publish/$rid"
              if ($LASTEXITCODE -ne 0) { throw "Publish of $project failed for $rid" }
            }
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "dist/Seneschal-$version-$rid.zip"
          }
          # The installer goes with every release too: irm https://github.com/<repo>/releases/latest/download/install.ps1 | iex
          Copy-Item install.ps1, install.cmd dist/
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

      - name: Check the zips
        shell: pwsh
        run: |
          # A zip without the app, its launcher or the SDK would install and then not start, so stop before it is published
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($zip in Get-ChildItem dist -Filter *.zip) {
            $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
            $names = $archive.Entries | ForEach-Object FullName
            $archive.Dispose()
            foreach ($required in 'Seneschal.exe', 'SeneschalApp.exe', 'Seneschal.Sdk.dll', 'wwwroot/app.css') {
              if ($names -notcontains $required) { throw "$($zip.Name) has no $required" }
            }
            Write-Host "$($zip.Name): $($names.Count) files, $([math]::Round($zip.Length / 1MB)) MB"
          }

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $flags = @()
          if ($version.Contains('-')) { $flags += '--prerelease' }
          gh release create "v$version" (Get-ChildItem dist | ForEach-Object FullName) --target "${{ github.sha }}" --title "Seneschal $version" --generate-notes @flags
          if ($LASTEXITCODE -ne 0) { throw "Could not create the release (does v$version already exist?)" }
